[project]
name = "iris-desktop"
version = "0.1.0"
description = "IRIS - local real-time camera filters"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mediapipe>=1.2.3,<2",
  "numpy>=2.4.1,<3",
  "opencv-contrib-python>=5.1.0.95,<6",
  "PySide6-Essentials==6.10.2",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.22.3,<7",
  "pytest>=9,<10",
]
ar3d = []  # Installed by scripts/install_qt_quick3d_runtime.sh on Ubuntu/Debian.

[project.scripts]
iris = "iris.__main__:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
