name: IRIS Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Desktop engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: desktop/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install desktop dependencies
        run: uv sync --directory desktop --extra dev

      - name: Run tests
        run: uv run --directory desktop pytest
